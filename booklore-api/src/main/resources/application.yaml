app:
  path-config: '/app/data'
  bookdrop-folder: '/bookdrop'
  version: 'development'

  cors:
    # Comma-separated list of allowed CORS origins.
    # Leave empty (default) to allow same-origin requests only.
    # Example: ALLOWED_ORIGINS=https://app.example.com,https://mobile.example.com
    allowed-origins: ${ALLOWED_ORIGINS:*}

  remote-auth:
    enabled: ${REMOTE_AUTH_ENABLED:false}
    create-new-users: ${REMOTE_AUTH_CREATE_NEW_USERS:true}
    header-name: ${REMOTE_AUTH_HEADER_NAME:Remote-Name}
    header-user: ${REMOTE_AUTH_HEADER_USER:Remote-User}
    header-email: ${REMOTE_AUTH_HEADER_EMAIL:Remote-Email}
    header-groups: ${REMOTE_AUTH_HEADER_GROUPS:Remote-Groups}
    admin-group: ${REMOTE_AUTH_ADMIN_GROUP}
    groups-delimiter: ${REMOTE_AUTH_GROUPS_DELIMITER:\\s+}
  force-disable-oidc: ${FORCE_DISABLE_OIDC:false}
  disk-type: ${DISK_TYPE:LOCAL}

  scan:
    # Directories listed at once while scanning a library (1-64).
    walk-parallelism: ${SCAN_WALK_PARALLELISM:16}
    # Seconds a directory listing may wait on one filesystem call before that directory
    # is skipped and reported as not scanned.
    directory-timeout-seconds: ${SCAN_DIRECTORY_TIMEOUT_SECONDS:60}
    # New-book import pipeline. false = the sequential loop and one scan-wide transaction, as before.
    import-pipeline-enabled: ${SCAN_IMPORT_PIPELINE_ENABLED:true}
    # Files read from storage at once, shared by all scans (1-128). Threads are platform threads.
    import-io-parallelism: ${SCAN_IMPORT_IO_PARALLELISM:16}
    # Groups in flight per scan, prepared but not yet saved included. 0 = 4 x io-parallelism (clamped io..512).
    import-window: ${SCAN_IMPORT_WINDOW:0}
    # Seconds one file may take once it has started reading before it is skipped and retried next scan (10-3600).
    import-file-timeout-seconds: ${SCAN_IMPORT_FILE_TIMEOUT_SECONDS:180}
    # Abandoned import threads still blocked on storage, process-wide, at which imports stop (1-128).
    import-max-stuck-threads: ${SCAN_IMPORT_MAX_STUCK_THREADS:16}
    # Concurrent cover decode/render/encode jobs. 0 = max(1, min(4, cores/2)) (clamped 1..16). PDF page renders read
    # the file as they draw, so only the heap budget bounds them.
    import-render-parallelism: ${SCAN_IMPORT_RENDER_PARALLELISM:0}
    # Heap reserved for decoding and FB2 parsing, MiB. 0 = maxHeap/4 clamped 128..1024; explicit values clamped 64..maxHeap/2.
    import-heap-budget-mb: ${SCAN_IMPORT_HEAP_BUDGET_MB:0}

server:
  max-http-header-size: 128KB
  forward-headers-strategy: native
  port: ${BOOKLORE_PORT:6060}
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml,application/xml,application/atom+xml
    min-response-size: 1024
  tomcat:
    relaxed-query-chars: '[,],%,{,},|'

spring:
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  servlet:
    multipart:
      enabled: false
  mvc:
    async:
      request-timeout: 600000
  application:
    name: booklore-api
  data:
    web:
      pageable:
        max-page-size: 100
  datasource:
    url: ${DATABASE_URL:jdbc:mariadb://${DATABASE_HOST:${DB_HOST:mariadb}}:${DATABASE_PORT:3306}/${DATABASE_NAME:booklore}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:${MYSQL_ROOT_PASSWORD}}
    hikari:
      pool-name: BookloreHikariPool
      max-lifetime: 580000         # 9.6 minutes (avoid DB-side connection cuts)
      connection-test-query: SELECT 1
      connection-timeout: 30000    # 30s to acquire a connection before timeout
      maximum-pool-size: 20        # Higher ceiling for virtual-thread bursts
      minimum-idle: 5              # Keep warm connections ready
      idle-timeout: 300000         # 5 minutes before idle connections are closed
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        query:
          timeout: 30              # 30s max for any HQL/JPQL query
        jdbc:
          time_zone: UTC
          batch_size: 500
          order_inserts: true
          order_updates: true
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    org.booklore: ${LOG_LEVEL:INFO}
    org.apache.fontbox: ERROR
    org.apache.pdfbox: ERROR
    org.quartz.core.QuartzScheduler: WARN
    org.quartz.simpl.SimpleThreadPool: WARN
    org.quartz.simpl.RAMJobStore: WARN
    org.hibernate.orm.connections.pooling: WARN
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
